name: Fetch Pixabay images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch new Pixabay images only when requested
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PIXABAY_FETCH_NEW_IMAGES: "true"
        run: node scripts/fetch-pixabay-images.mjs

      - name: Commit new images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/data/image-sources.json
          if git diff --cached --quiet; then
            echo "No new Pixabay files to commit."
            exit 0
          fi
          git commit -m "chore: add cached Pixabay images"
          git push
