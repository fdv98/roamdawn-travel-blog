<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Winter and summer in Japan</title><desc id="desc">A clean travel illustration comparing snowy winter scenery with lush summer scenery in Japan.</desc><rect width="1600" height="900" fill="#eef9fc"/><path d="M0 620 Q400 550 800 620 T1600 600 V900 H0Z" fill="#dff1f5"/><path d="M0 620 L230 330 L470 620 L650 360 L850 620Z" fill="#cfe3eb"/><path d="M90 620 L230 440 L370 620Z" fill="#ffffff"/><circle cx="350" cy="190" r="100" fill="#e9f5ff"/><path d="M820 620 Q1120 500 1600 580 V900 H820Z" fill="#d9efd8"/><path d="M1130 650 V350 M1130 430 L1010 340 M1130 500 L1260 390" stroke="#6c5a43" stroke-width="30" stroke-linecap="round" fill="none"/><circle cx="1010" cy="330" r="45" fill="#6fbd62"/><circle cx="1100" cy="300" r="48" fill="#82c96d"/><circle cx="1240" cy="380" r="45" fill="#69b95e"/><circle cx="1330" cy="340" r="48" fill="#8bd071"/><circle cx="1280" cy="170" r="95" fill="#ffd76b"/><text x="130" y="120" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#17324d">Winter • Summer</text><text x="134" y="180" font-family="Arial, sans-serif" font-size="30" fill="#4c6b7a">Snow in the north, greenery and warmth in summer</text><text x="250" y="790" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1596c2">Winter scenery</text><text x="1160" y="790" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#4c9b57">Summer greenery</text></svg>